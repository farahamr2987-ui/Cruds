<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mostafa — ID Card</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --gold:#d4a843;
  --gold2:#f0c96a;
  --deep:#06040e;
  --card:#0d0a1a;
  --text:#ede8dc;
  --muted:#6b6480;
  --accent:#7c3aed;
}

html,body{
  width:100%;min-height:100vh;
  background:var(--deep);
  display:flex;justify-content:center;align-items:center;
  font-family:'Inter',sans-serif;
  overflow:hidden;
  cursor:none;
}

/* ── Custom cursor ── */
.cursor{
  position:fixed;width:12px;height:12px;
  border-radius:50%;background:var(--gold);
  pointer-events:none;z-index:9999;
  transform:translate(-50%,-50%);
  transition:transform .1s,opacity .2s;
  mix-blend-mode:difference;
}
.cursor-ring{
  position:fixed;width:36px;height:36px;
  border-radius:50%;border:1px solid rgba(212,168,67,.5);
  pointer-events:none;z-index:9998;
  transform:translate(-50%,-50%);
  transition:transform .18s ease,width .3s,height .3s,border-color .3s;
}

/* ── Star canvas ── */
#stars{position:fixed;inset:0;z-index:0}

/* ── Scene / 3D tilt ── */
.scene{
  position:relative;z-index:1;
  perspective:900px;
  perspective-origin:50% 50%;
}

/* ── Card shell ── */
.card{
  position:relative;
  width:min(500px,92vw);
  border-radius:28px;
  padding:52px 48px 44px;
  transform-style:preserve-3d;
  transform:rotateX(0deg) rotateY(0deg);
  transition:transform .05s linear;
  overflow:hidden;

  background:
    radial-gradient(ellipse at 20% 0%,rgba(124,58,237,.18) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 100%,rgba(212,168,67,.12) 0%,transparent 60%),
    linear-gradient(145deg,#120e22 0%,#0a0715 50%,#110d20 100%);

  box-shadow:
    0 0 0 1px rgba(212,168,67,.15),
    0 30px 80px rgba(0,0,0,.8),
    0 0 120px rgba(124,58,237,.08),
    inset 0 1px 0 rgba(255,255,255,.06),
    inset 0 -1px 0 rgba(0,0,0,.5);

  animation:cardIn .9s cubic-bezier(.16,1,.3,1) both;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(60px) rotateX(8deg) scale(.96)}
  to{opacity:1;transform:translateY(0) rotateX(0) scale(1)}
}

/* Holographic sheen overlay */
.card::before{
  content:'';
  position:absolute;inset:0;border-radius:28px;
  background:linear-gradient(115deg,
    transparent 20%,
    rgba(212,168,67,.04) 30%,
    rgba(124,58,237,.06) 40%,
    rgba(100,200,255,.05) 50%,
    transparent 60%
  );
  background-size:300% 300%;
  animation:holo 6s ease-in-out infinite alternate;
  pointer-events:none;z-index:1;
}
@keyframes holo{
  0%{background-position:0% 0%}
  100%{background-position:100% 100%}
}

/* Grain texture */
.card::after{
  content:'';
  position:absolute;inset:0;border-radius:28px;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:.035;pointer-events:none;z-index:2;
}

.inner{position:relative;z-index:3}

/* ── Top row ── */
.toprow{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:42px;
}

.badge{
  font-family:'Space Mono',monospace;
  font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold);
  border:1px solid rgba(212,168,67,.3);
  border-radius:100px;padding:5px 14px;
  background:rgba(212,168,67,.06);
  backdrop-filter:blur(4px);
}

.serial{
  font-family:'Space Mono',monospace;
  font-size:9px;letter-spacing:.12em;
  color:var(--muted);
}

/* ── Avatar + name block ── */
.hero{
  display:flex;align-items:center;gap:24px;
  margin-bottom:40px;
}

.avatar{
  flex-shrink:0;
  width:76px;height:76px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;
  font-size:32px;font-weight:700;color:#fff;
  position:relative;
  box-shadow:0 0 0 2px rgba(212,168,67,.3),0 0 30px rgba(124,58,237,.4);
  animation:avatarPulse 3s ease-in-out infinite;
}
@keyframes avatarPulse{
  0%,100%{box-shadow:0 0 0 2px rgba(212,168,67,.3),0 0 30px rgba(124,58,237,.4)}
  50%{box-shadow:0 0 0 4px rgba(212,168,67,.2),0 0 50px rgba(124,58,237,.6)}
}

.avatar::after{
  content:'';
  position:absolute;inset:-4px;border-radius:50%;
  border:1px solid transparent;
  border-top-color:var(--gold);border-right-color:var(--gold);
  animation:spin 4s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.name-block{}

.name-en{
  font-family:'Cormorant Garamond',serif;
  font-size:30px;font-weight:700;
  color:var(--text);
  line-height:1.05;letter-spacing:-.5px;
}
.name-en em{
  font-style:normal;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

.nickname{
  margin-top:6px;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:300;
}

/* ── Separator ── */
.sep{
  position:relative;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,168,67,.3),transparent);
  margin:32px 0;
}
.sep-diamond{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) rotate(45deg);
  width:8px;height:8px;
  background:var(--card);
  border:1px solid rgba(212,168,67,.4);
}

/* ── Info rows ── */
.rows{display:flex;flex-direction:column;gap:0}

.row{
  display:grid;grid-template-columns:110px 1fr;
  align-items:center;gap:12px;
  padding:15px 0;
  border-bottom:1px solid rgba(255,255,255,.04);
  opacity:0;
  animation:rowIn .5s cubic-bezier(.16,1,.3,1) forwards;
}
.row:last-child{border-bottom:none}
.row:nth-child(1){animation-delay:.3s}
.row:nth-child(2){animation-delay:.42s}
.row:nth-child(3){animation-delay:.54s}

@keyframes rowIn{
  from{opacity:0;transform:translateX(-16px)}
  to{opacity:1;transform:translateX(0)}
}

.row-key{
  display:flex;align-items:center;gap:7px;
  font-family:'Space Mono',monospace;
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);
}
.row-key .pip{
  width:4px;height:4px;border-radius:50%;
  background:var(--gold);opacity:.7;flex-shrink:0;
}

.row-val{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;font-weight:600;
  color:var(--text);letter-spacing:.02em;
}

/* ── Footer ── */
.footer{
  margin-top:36px;
  display:flex;justify-content:space-between;align-items:center;
}

.status{
  display:flex;align-items:center;gap:8px;
  font-family:'Space Mono',monospace;
  font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);
}
.pulse-dot{
  width:7px;height:7px;border-radius:50%;
  background:#4ade80;
  box-shadow:0 0 10px #4ade80,0 0 20px rgba(74,222,128,.4);
  animation:blink 2.4s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* DNA barcode */
.dna{
  display:flex;align-items:center;gap:1.5px;
  height:32px;opacity:.4;
}
.dna-bar{
  width:2px;border-radius:2px;
  background:linear-gradient(to top,var(--accent),var(--gold));
}

/* ── Corner accents ── */
.corner{
  position:absolute;width:20px;height:20px;
  border-color:rgba(212,168,67,.4);border-style:solid;
  z-index:4;
}
.corner.tl{top:18px;left:18px;border-width:1px 0 0 1px;border-radius:4px 0 0 0}
.corner.tr{top:18px;right:18px;border-width:1px 1px 0 0;border-radius:0 4px 0 0}
.corner.bl{bottom:18px;left:18px;border-width:0 0 1px 1px;border-radius:0 0 0 4px}
.corner.br{bottom:18px;right:18px;border-width:0 1px 1px 0;border-radius:0 0 4px 0}

/* ── Scan line effect ── */
.scanline{
  position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(124,58,237,.6),rgba(212,168,67,.4),transparent);
  animation:scan 4s ease-in-out infinite;
  pointer-events:none;z-index:5;border-radius:28px;
}
@keyframes scan{
  0%{top:10%;opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{top:90%;opacity:0}
}

@media(max-width:480px){
  .card{padding:36px 28px 32px}
  .name-en{font-size:24px}
  .row-val{font-size:18px}
  .hero{gap:16px}
  .avatar{width:60px;height:60px;font-size:24px}
}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="ring"></div>

<div class="scene">
  <div class="card" id="card">
    <div class="scanline"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="inner">
      <div class="toprow">
        <div class="badge">✦ Personal ID</div>
        <div class="serial">EG · MH · 2010 · 001</div>
      </div>

      <div class="hero">
        <div class="avatar">M</div>
        <div class="name-block">
          <div class="name-en">Mostafa<br><em>Mohamed</em> Mostafa</div>
          <div class="nickname">💖 Habib Farah</div>
        </div>
      </div>

      <div class="sep"><div class="sep-diamond"></div></div>

      <div class="rows">
        <div class="row">
          <div class="row-key"><span class="pip"></span>Mobile</div>
          <div class="row-val">011 1878 4455</div>
        </div>
        <div class="row">
          <div class="row-key"><span class="pip"></span>Born</div>
          <div class="row-val">Nov 12, 2010</div>
        </div>
        <div class="row">
          <div class="row-key"><span class="pip"></span>Age</div>
          <div class="row-val">15 Years Old</div>
        </div>
      </div>

      <div class="footer">
        <div class="status">
          <div class="pulse-dot"></div>
          Active · 2025
        </div>
        <div class="dna" id="dna"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ── Stars ── */
const canvas=document.getElementById('stars');
const ctx=canvas.getContext('2d');
let W,H,stars=[];
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  stars=Array.from({length:140},()=>({
    x:Math.random()*W,y:Math.random()*H,
    r:Math.random()*1.2+.2,
    o:Math.random()*.6+.1,
    s:Math.random()*.5+.2
  }));
}
function drawStars(){
  ctx.clearRect(0,0,W,H);
  stars.forEach(s=>{
    s.o+=Math.sin(Date.now()*0.001*s.s)*.006;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(220,200,255,${Math.max(.05,Math.min(.7,s.o))})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
resize();drawStars();
window.addEventListener('resize',resize);

/* ── DNA barcode ── */
const dna=document.getElementById('dna');
const heights=[100,55,80,100,40,90,65,100,45,75,100,60,85,50,100,70,40,95,60,100];
heights.forEach(h=>{
  const d=document.createElement('div');
  d.className='dna-bar';
  d.style.height=h*.32+'px';
  dna.appendChild(d);
});

/* ── 3D Tilt ── */
const card=document.getElementById('card');
const scene=card.parentElement;
let mx=0,my=0,bx=0,by=0;

document.addEventListener('mousemove',e=>{
  const r=scene.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  mx=((e.clientX-cx)/r.width)*18;
  my=-((e.clientY-cy)/r.height)*14;

  /* cursor */
  document.getElementById('cur').style.left=e.clientX+'px';
  document.getElementById('cur').style.top=e.clientY+'px';
  document.getElementById('ring').style.left=e.clientX+'px';
  document.getElementById('ring').style.top=e.clientY+'px';
});

document.addEventListener('mouseleave',()=>{mx=0;my=0});

function tiltLoop(){
  bx+=(mx-bx)*.08;
  by+=(my-by)*.08;
  card.style.transform=`rotateY(${bx}deg) rotateX(${by}deg)`;
  requestAnimationFrame(tiltLoop);
}
tiltLoop();

/* ── Touch tilt for mobile ── */
document.addEventListener('touchmove',e=>{
  const t=e.touches[0];
  const r=scene.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  mx=((t.clientX-cx)/r.width)*12;
  my=-((t.clientY-cy)/r.height)*10;
},{passive:true});
document.addEventListener('touchend',()=>{mx=0;my=0});
</script>
</body>
</html>
