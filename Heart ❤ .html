<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Heart Animation - Enhanced</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(ellipse at center, #1a0510 0%, #000000 70%);
    overflow: hidden;
    height: 100%;
  }
  canvas {
    display: block;
  }
  svg#heartPath {
    display: none;
  }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(255,45,120,0) 40%, rgba(0,0,0,0.55) 100%);
    animation: vignettePulse 4s ease-in-out infinite;
    z-index: 2;
  }
  @keyframes vignettePulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 0.9; }
  }
  #hint {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    z-index: 3;
    animation: hintFade 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes hintFade {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>

<div id="vignette"></div>
<div id="hint">✨ دوس في أي مكان عشان تطلق قلوب ✨</div>

<!-- المسار (Path) بتاع شكل القلب، هستخدمه بس عشان أحسب منه نقاط عشان أوزع عليها الجزيئات -->
<svg id="heartPath" viewBox="0 0 32 29.6">
  <path d="M23.6,0c-3.4,0-6.3,2.1-7.6,5.1C14.7,2.1,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4
           c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============ 1. تجهيز الـ Scene والـ Camera والـ Renderer ============
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 150;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ============ 1.5 خلفية نجوم متلألئة (Starfield) عشان يبقى في عمق وحيوية ============
const starCount = 600;
const starPositions = new Float32Array(starCount * 3);
const starPhases = new Float32Array(starCount); // كل نجمة بتلمع بسرعة مختلفة
for (let i = 0; i < starCount; i++) {
  const radius = 300 + Math.random() * 500;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos((Math.random() * 2) - 1);
  starPositions[i * 3]     = radius * Math.sin(phi) * Math.cos(theta);
  starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
  starPositions[i * 3 + 2] = radius * Math.cos(phi);
  starPhases[i] = Math.random() * Math.PI * 2;
}
const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
const starMaterial = new THREE.PointsMaterial({
  color: 0xffffff,
  size: 1.1,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending
});
const stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);

// ============ 1.6 نجوم شهب عابرة (Shooting stars) بتظهر بين الحين والتاني ============
const shootingStarCount = 4;
const shootingStars = [];
for (let i = 0; i < shootingStarCount; i++) {
  const trailLength = 14;
  const trailPositions = new Float32Array(trailLength * 3);
  const trailGeometry = new THREE.BufferGeometry();
  trailGeometry.setAttribute("position", new THREE.BufferAttribute(trailPositions, 3));
  const trailMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 1.6,
    transparent: true,
    opacity: 0,
    blending: THREE.AdditiveBlending
  });
  const trail = new THREE.Points(trailGeometry, trailMaterial);
  scene.add(trail);
  shootingStars.push({
    trail,
    active: false,
    nextTrigger: 2 + Math.random() * 6,
    progress: 0,
    start: new THREE.Vector3(),
    end: new THREE.Vector3()
  });
}

function triggerShootingStar(star) {
  const startSide = -400;
  const y = 100 + Math.random() * 200;
  star.start.set(startSide, y, -100 + Math.random() * 150);
  star.end.set(-startSide, y - 150 - Math.random() * 100, -100 + Math.random() * 150);
  star.progress = 0;
  star.active = true;
  star.trail.material.opacity = 0.9;
}

// ============ 2. أخذ نقاط شكل القلب من الـ SVG path ============
const path = document.querySelector("#heartPath path");
const length = path.getTotalLength();
const vertices = [];

// نلف على طول المسار ونجمع نقاط كل ما نتقدم بمسافة صغيرة (0.1)
for (let i = 0; i < length; i += 0.1) {
  const point = path.getPointAtLength(i);
  const vector = new THREE.Vector3(point.x, -point.y, 0);

  // نكبر الحجم ونحط الإحداثيات في المنتصف
  vector.x = (vector.x - 16) * 4;
  vector.y = (vector.y + 15) * 4;
  vector.z = (Math.random() - 0.5) * 70;

  vertices.push(vector);
}

// ============ 3. عمل الجيوميتري (النقاط) والمادة (Material) للقلب الأساسي ============
const geometry = new THREE.BufferGeometry().setFromPoints(vertices);

// نضيف لون مختلف شوية لكل نقطة عشان يبقى في تدرج لوني حي بدل اللون الواحد الثابت
const particleCount = vertices.length;
const colors = new Float32Array(particleCount * 3);
const baseColor = new THREE.Color();
for (let i = 0; i < particleCount; i++) {
  const mix = Math.random();
  baseColor.setHSL(0.92 - mix * 0.06, 0.9, 0.55 + mix * 0.2); // من وردي غامق لوردي فاتح/بنفسجي خفيف
  colors[i * 3] = baseColor.r;
  colors[i * 3 + 1] = baseColor.g;
  colors[i * 3 + 2] = baseColor.b;
}
geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 1.5,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending
});

const heart = new THREE.Points(geometry, material);

// ============ 3.5 طبقة توهج (Glow layer) خلف القلب لإحساس البلوم بدون بوست-بروسيسينج ============
const glowGeometry = new THREE.BufferGeometry();
glowGeometry.setAttribute("position", new THREE.BufferAttribute(geometry.attributes.position.array.slice(), 3));
const glowMaterial = new THREE.PointsMaterial({
  color: 0xff2d78,
  size: 5.5,
  transparent: true,
  opacity: 0.18,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const heartGlow = new THREE.Points(glowGeometry, glowMaterial);

// مجموعة واحدة تضم القلب والتوهج والنص عشان يدوروا مع بعض بنفس الحركة
const heartGroup = new THREE.Group();
heartGroup.add(heartGlow);
heartGroup.add(heart);
scene.add(heartGroup);

// نحفظ المواضع الأصلية (الشكل النهائي للقلب) عشان نستخدمها في التكوين والنبض
const originalPositions = geometry.attributes.position.array.slice();

// ============ 3.6 جزيئات سبارك (Sparkles) بتتطاير من حوالين القلب لفوق ============
const sparkCount = 140;
const sparkGeometry = new THREE.BufferGeometry();
const sparkPositions = new Float32Array(sparkCount * 3);
const sparkSpeeds = new Float32Array(sparkCount);
const sparkOffsets = new Float32Array(sparkCount);
for (let i = 0; i < sparkCount; i++) {
  const srcIndex = Math.floor(Math.random() * particleCount) * 3;
  sparkPositions[i * 3]     = originalPositions[srcIndex];
  sparkPositions[i * 3 + 1] = originalPositions[srcIndex + 1];
  sparkPositions[i * 3 + 2] = originalPositions[srcIndex + 2];
  sparkSpeeds[i] = 6 + Math.random() * 10;
  sparkOffsets[i] = Math.random() * 100;
}
sparkGeometry.setAttribute("position", new THREE.BufferAttribute(sparkPositions, 3));
const sparkMaterial = new THREE.PointsMaterial({
  color: 0xffd9e8,
  size: 1.1,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending
});
const sparks = new THREE.Points(sparkGeometry, sparkMaterial);
heartGroup.add(sparks);
const sparkOrigin = originalPositions.slice(); // نحتفظ بمصدر كل شرارة عشان نرجعها لما توصل لأعلى ارتفاع

// ============ 3.7 قلوب صغيرة بتدور حوالين القلب الرئيسي (Orbiting mini hearts) ============
const miniHeartCount = 6;
const miniHearts = [];
for (let i = 0; i < miniHeartCount; i++) {
  const miniVertices = vertices.map(v => new THREE.Vector3(v.x * 0.12, v.y * 0.12, v.z * 0.12));
  const miniGeo = new THREE.BufferGeometry().setFromPoints(miniVertices);
  const hue = 0.9 + Math.random() * 0.08;
  const miniColor = new THREE.Color().setHSL(hue, 0.85, 0.65);
  const miniMat = new THREE.PointsMaterial({
    color: miniColor,
    size: 1.2,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending
  });
  const miniHeart = new THREE.Points(miniGeo, miniMat);
  miniHearts.push({
    mesh: miniHeart,
    radius: 55 + Math.random() * 25,
    speed: 0.3 + Math.random() * 0.3,
    angleOffset: (i / miniHeartCount) * Math.PI * 2,
    verticalSpeed: 0.5 + Math.random() * 0.5,
    verticalOffset: Math.random() * Math.PI * 2
  });
  heartGroup.add(miniHeart);
}

// ============ نص "I love you" كنسيج (texture) داخل المشهد نفسه عشان يلف مع القلب ============
const fullText = "I love you";
const textCanvas = document.createElement("canvas");
textCanvas.width = 1024;
textCanvas.height = 384;
const ctx = textCanvas.getContext("2d");

function drawLoveText(revealCount) {
  ctx.clearRect(0, 0, textCanvas.width, textCanvas.height);
  const visible = fullText.slice(0, revealCount);

  ctx.font = "italic bold 150px 'Brush Script MT', 'Segoe Script', cursive";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // توهج وردي حوالين الحروف
  ctx.shadowColor = "#ff1a6d";
  ctx.shadowBlur = 35;
  ctx.fillStyle = "#ffffff";
  ctx.fillText(visible, textCanvas.width / 2, textCanvas.height / 2);

  // طبقة توهج إضافية عشان يبان لامع
  ctx.shadowBlur = 15;
  ctx.fillStyle = "#ffd1e3";
  ctx.fillText(visible, textCanvas.width / 2, textCanvas.height / 2);
}
drawLoveText(0);

const textTexture = new THREE.Texture(textCanvas);
textTexture.needsUpdate = true;

const textMaterial = new THREE.MeshBasicMaterial({
  map: textTexture,
  transparent: true,
  opacity: 0,
  depthWrite: false,
  side: THREE.DoubleSide
});

const textGeometry = new THREE.PlaneGeometry(95, 35.6);
const textMesh = new THREE.Mesh(textGeometry, textMaterial);
textMesh.position.set(0, 2, 1); // جوه القلب شوية قدام عشان يبان فوق الجزيئات
heartGroup.add(textMesh);

// ============ 4. تجهيز نقاط بداية عشوائية (متناثرة في الفضاء) عشان يتكوّن منها القلب ============
const startPositions = new Float32Array(originalPositions.length);
for (let i = 0; i < startPositions.length; i += 3) {
  const radius = 250 + Math.random() * 200;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos((Math.random() * 2) - 1);
  startPositions[i]     = radius * Math.sin(phi) * Math.cos(theta);
  startPositions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
  startPositions[i + 2] = radius * Math.cos(phi);
}
// نبدأ الجزيئات (القلب والتوهج) من مواضعها المتناثرة
geometry.attributes.position.array.set(startPositions);
geometry.attributes.position.needsUpdate = true;
glowGeometry.attributes.position.array.set(startPositions);
glowGeometry.attributes.position.needsUpdate = true;

// ============ 4.5 تتبع حركة الماوس لإحساس Parallax خفيف ============
let mouseX = 0, mouseY = 0;
window.addEventListener("mousemove", (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

// ============ 4.6 نظام انفجار جزيئات عند الضغط (Click burst) ============
const bursts = [];
const raycaster = new THREE.Raycaster();
const clickPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

function spawnBurst(worldPoint) {
  const count = 60;
  const positions = new Float32Array(count * 3);
  const velocities = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = worldPoint.x;
    positions[i * 3 + 1] = worldPoint.y;
    positions[i * 3 + 2] = worldPoint.z;
    const dir = new THREE.Vector3((Math.random() - 0.5), (Math.random() - 0.5), (Math.random() - 0.5)).normalize();
    const speed = 30 + Math.random() * 50;
    velocities[i * 3] = dir.x * speed;
    velocities[i * 3 + 1] = dir.y * speed + 10; // ميل بسيط لفوق
    velocities[i * 3 + 2] = dir.z * speed;
  }
  const burstGeo = new THREE.BufferGeometry();
  burstGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const hue = 0.9 + Math.random() * 0.08;
  const burstMat = new THREE.PointsMaterial({
    color: new THREE.Color().setHSL(hue, 1, 0.7),
    size: 2,
    transparent: true,
    opacity: 1,
    blending: THREE.AdditiveBlending
  });
  const points = new THREE.Points(burstGeo, burstMat);
  scene.add(points);
  bursts.push({ points, velocities, age: 0, life: 1.4 });
}

window.addEventListener("pointerdown", (e) => {
  const ndc = new THREE.Vector2(
    (e.clientX / window.innerWidth) * 2 - 1,
    -(e.clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const target = new THREE.Vector3();
  raycaster.ray.intersectPlane(clickPlane, target);
  if (target) spawnBurst(target);
});

// ============ 5. حركة التكوين (Formation) ثم النبض (Pulse) والدوران ============
const clock = new THREE.Clock();
const FORMATION_DURATION = 3.0; // مدة تجمّع الجزيئات لتكوين القلب (بالثواني)
let formationDone = false;

// دالة تسهيل الحركة (easing) عشان التجمّع يبقى ناعم
function easeOutCubic(x) {
  return 1 - Math.pow(1 - x, 3);
}

const TEXT_FORMATION_DURATION = 1.4; // مدة تكوّن الكلمة حرف حرف بعد اكتمال القلب
let textStartTime = null;
let lastRevealCount = -1;

function animate() {
  requestAnimationFrame(animate);

  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  const positions = geometry.attributes.position.array;
  const glowPositions = glowGeometry.attributes.position.array;

  if (t < FORMATION_DURATION) {
    // مرحلة التكوين: كل نقطة بتتحرك من مكانها العشوائي لمكانها في شكل القلب
    const progress = easeOutCubic(t / FORMATION_DURATION);
    for (let i = 0; i < positions.length; i++) {
      const val = startPositions[i] + (originalPositions[i] - startPositions[i]) * progress;
      positions[i] = val;
      glowPositions[i] = val;
    }
    heartGroup.rotation.y += 0.01; // دوران أسرع شوية أثناء التكوين لإحساس أجمل
  } else {
    // مرحلة النبض بعد اكتمال التكوين
    if (!formationDone) {
      formationDone = true;
      textStartTime = t;
    }
    const pulseT = t - FORMATION_DURATION;
    const scale = 1 + Math.sin(pulseT * 3) * 0.05;
    const glowScale = scale * (1 + Math.sin(pulseT * 3) * 0.03);
    for (let i = 0; i < positions.length; i += 3) {
      positions[i]     = originalPositions[i]     * scale;
      positions[i + 1] = originalPositions[i + 1] * scale;
      positions[i + 2] = originalPositions[i + 2] * scale;

      glowPositions[i]     = originalPositions[i]     * glowScale;
      glowPositions[i + 1] = originalPositions[i + 1] * glowScale;
      glowPositions[i + 2] = originalPositions[i + 2] * glowScale;
    }

    // دوران القلب مع ميل خفيف بيتبع الماوس (Parallax)
    heartGroup.rotation.y += 0.004;
    heartGroup.rotation.x += (mouseY * 0.15 - heartGroup.rotation.x) * 0.03;
    heartGroup.rotation.z += (-mouseX * 0.08 - heartGroup.rotation.z) * 0.03;

    // نبضة لونية خفيفة: التوهج بيقوى شوية مع كل نبضة قلب
    heartGlow.material.opacity = 0.14 + Math.abs(Math.sin(pulseT * 3)) * 0.12;

    // تكوين كلمة "I love you" حرف حرف بعد اكتمال القلب
    if (textStartTime !== null) {
      const textProgress = Math.min((t - textStartTime) / TEXT_FORMATION_DURATION, 1);
      const revealCount = Math.round(easeOutCubic(textProgress) * fullText.length);
      if (revealCount !== lastRevealCount) {
        drawLoveText(revealCount);
        textTexture.needsUpdate = true;
        lastRevealCount = revealCount;
      }
      textMaterial.opacity = textProgress; // ظهور تدريجي مع التكوين
    }

    // تحريك الشرارات (Sparkles) بحيث تطلع لفوق وتلمع وترجع تاني من مصدرها
    const sPos = sparkGeometry.attributes.position.array;
    for (let i = 0; i < sparkCount; i++) {
      const cycle = ((t * sparkSpeeds[i] + sparkOffsets[i]) % 40) / 40; // 0 -> 1 بشكل دوري
      const idx = i * 3;
      sPos[idx]     = sparkOrigin[idx]     + Math.sin(t + i) * 3;
      sPos[idx + 1] = sparkOrigin[idx + 1] + cycle * 60; // بتطلع لفوق تدريجيًا
      sPos[idx + 2] = sparkOrigin[idx + 2] + Math.cos(t + i) * 3;
    }
    sparkGeometry.attributes.position.needsUpdate = true;
    sparks.material.opacity = 0.85 * (1 - 0.4 * Math.sin(t * 2)); // ومضان خفيف

    // تلوين متغيّر ببطء: كل الجزيئات بتتزحلق في التدرج اللوني عشان القلب "يتنفس" بالألوان
    const colorArr = geometry.attributes.color.array;
    for (let i = 0; i < particleCount; i++) {
      const mix = (Math.sin(t * 0.3 + i * 0.05) + 1) / 2;
      const c = new THREE.Color().setHSL(0.9 - mix * 0.08 + Math.sin(t * 0.1) * 0.02, 0.9, 0.5 + mix * 0.25);
      colorArr[i * 3] = c.r;
      colorArr[i * 3 + 1] = c.g;
      colorArr[i * 3 + 2] = c.b;
    }
    geometry.attributes.color.needsUpdate = true;

    // تحريك القلوب الصغيرة في مدار حوالين القلب الرئيسي
    miniHearts.forEach(mh => {
      const angle = t * mh.speed + mh.angleOffset;
      mh.mesh.position.set(
        Math.cos(angle) * mh.radius,
        Math.sin(t * mh.verticalSpeed + mh.verticalOffset) * 20,
        Math.sin(angle) * mh.radius
      );
      mh.mesh.rotation.y = angle * 1.5;
      const pulse = 0.9 + Math.sin(t * 4 + mh.angleOffset) * 0.15;
      mh.mesh.scale.set(pulse, pulse, pulse);
    });
  }

  // نبضة كاميرا بسيطة (تنفّس) عشان يحس المشاهد بعمق وحيوية
  camera.position.z = 150 + Math.sin(t * 0.6) * 4;

  // تدوير خفيف جدًا للنجوم عشان الخلفية مش ثابتة تمامًا
  stars.rotation.y += 0.0004;
  stars.rotation.x += 0.0001;

  // تحديث نجوم الشهب: تتحرك، تسيب ذيل، وترجع تختفي لحد ما تتفعل تاني
  shootingStars.forEach(star => {
    if (!star.active) {
      star.nextTrigger -= dt;
      if (star.nextTrigger <= 0) {
        triggerShootingStar(star);
        star.nextTrigger = 4 + Math.random() * 8;
      }
      return;
    }
    star.progress += dt * 0.6;
    if (star.progress >= 1) {
      star.active = false;
      star.trail.material.opacity = 0;
      return;
    }
    const headPos = new THREE.Vector3().lerpVectors(star.start, star.end, star.progress);
    const trailPos = star.trail.geometry.attributes.position.array;
    const trailLen = trailPos.length / 3;
    for (let i = trailLen - 1; i > 0; i--) {
      trailPos[i * 3] = trailPos[(i - 1) * 3];
      trailPos[i * 3 + 1] = trailPos[(i - 1) * 3 + 1];
      trailPos[i * 3 + 2] = trailPos[(i - 1) * 3 + 2];
    }
    trailPos[0] = headPos.x;
    trailPos[1] = headPos.y;
    trailPos[2] = headPos.z;
    star.trail.geometry.attributes.position.needsUpdate = true;
    star.trail.material.opacity = 0.9 * (1 - star.progress);
  });

  // تحديث انفجارات النقر: توسّع، جاذبية خفيفة، وتلاشي، وبعدين تتشال من المشهد
  for (let b = bursts.length - 1; b >= 0; b--) {
    const burst = bursts[b];
    burst.age += dt;
    const pos = burst.points.geometry.attributes.position.array;
    for (let i = 0; i < pos.length / 3; i++) {
      pos[i * 3]     += burst.velocities[i * 3] * dt;
      pos[i * 3 + 1] += burst.velocities[i * 3 + 1] * dt;
      pos[i * 3 + 2] += burst.velocities[i * 3 + 2] * dt;
      burst.velocities[i * 3 + 1] -= 40 * dt; // جاذبية بسيطة بتخلي الجزيئات تنزل تاني
    }
    burst.points.geometry.attributes.position.needsUpdate = true;
    burst.points.material.opacity = Math.max(0, 1 - burst.age / burst.life);
    if (burst.age >= burst.life) {
      scene.remove(burst.points);
      burst.points.geometry.dispose();
      burst.points.material.dispose();
      bursts.splice(b, 1);
    }
  }

  geometry.attributes.position.needsUpdate = true;
  glowGeometry.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);
}
animate();

// ============ 6. تعديل الحجم مع تغيير حجم الشاشة ============
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
