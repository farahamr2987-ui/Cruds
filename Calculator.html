<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 0%, #3a3f47, #15171b 70%);
            font-family: 'Courier New', monospace;
        }

        .calc {
            background: linear-gradient(160deg, #2b2e34, #1c1e22);
            border-radius: 24px;
            padding: 24px;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            width: 300px;
        }

        .screen-wrap {
            background: #0d0f10;
            border-radius: 12px;
            padding: 18px 14px;
            margin-bottom: 18px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        .screen-wrap::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(to bottom,
                    rgba(255, 255, 255, 0.02) 0px,
                    rgba(255, 255, 255, 0.02) 1px,
                    transparent 1px,
                    transparent 3px);
            pointer-events: none;
        }

        #inp {
            width: 100%;
            border: none;
            background: transparent;
            color: #ffb000;
            font-family: 'Courier New', monospace;
            font-size: 2.2rem;
            text-align: right;
            text-shadow: 0 0 8px rgba(255, 176, 0, 0.6);
            letter-spacing: 2px;
            outline: none;
            padding: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            font-family: 'Courier New', monospace;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 16px 0;
            border-radius: 10px;
            border: none;
            background: linear-gradient(160deg, #45494f, #353840);
            color: #e8e6e1;
            box-shadow:
                0 3px 0 #14161a,
                0 4px 6px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.05s ease, box-shadow 0.05s ease;
        }

        button:active {
            transform: translateY(3px);
            box-shadow:
                0 0 0 #14161a,
                0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .op {
            background: linear-gradient(160deg, #ff9d2f, #d9791a);
            color: #1c1e22;
            box-shadow:
                0 3px 0 #a85f10,
                0 4px 6px rgba(0, 0, 0, 0.4);
        }

        .op:active {
            box-shadow:
                0 0 0 #a85f10,
                0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .eq {
            background: linear-gradient(160deg, #ffb000, #cc8800);
            color: #1c1e22;
            box-shadow:
                0 3px 0 #8a5c00,
                0 4px 6px rgba(0, 0, 0, 0.4);
            grid-column: span 2;
        }

        .eq:active {
            box-shadow:
                0 0 0 #8a5c00,
                0 1px 2px rgba(0, 0, 0, 0.4);
        }
    </style>

</head>

<body>

    <div class="calc">
        <div class="screen-wrap">
            <input type="text" id="inp">
        </div>

        <div class="grid">
            <button onclick="inp.value+='1'">1</button>
            <button onclick="inp.value+='2'">2</button>
            <button onclick="inp.value+='3'">3</button>
            <button class="op" onclick="inp.value+='+'">+</button>

            <button onclick="inp.value+='4'">4</button>
            <button onclick="inp.value+='5'">5</button>
            <button onclick="inp.value+='6'">6</button>
            <button class="op" onclick="inp.value+='-'">-</button>

            <button onclick="inp.value+='7'">7</button>
            <button onclick="inp.value+='8'">8</button>
            <button onclick="inp.value+='9'">9</button>
            <button class="op" onclick="inp.value+='*'">*</button>

            <button onclick="inp.value+='0'">0</button>
            <button class="op" onclick="inp.value+='/'">/</button>

            <button class="eq" onclick="inp.value=eval(inp.value)">=</button>
        </div>
    </div>

</body>

</html>
