 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --white:#ffffff;
            --glass:rgba(255,255,255,0.10);
            --glass-strong:rgba(255,255,255,0.16);
            --border:rgba(255,255,255,0.22);
            --amber:#ffc857;
            --pink:#ff6fa5;
            --muted:rgba(255,255,255,0.65);
        }

        *{ box-sizing:border-box; }

        body{
            margin:0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            font-family:'Inter', system-ui, sans-serif;
            color:var(--white);
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 45%, #831843 100%);
            background-attachment:fixed;
        }

        .panel{
            width:100%;
            max-width:380px;
            border:1px solid  ;
            border-radius:22px;
            padding:28px 26px 22px;
            box-shadow:0 20px 50px -20px rgba(0,0,0,0.55);
        }

      
       

        .panel h1{
            margin:0 0 4px;
            font-family:'Poppins', sans-serif;
            font-weight:800;
            font-size:22px;
            letter-spacing:.2px;
        }
 
        #inp{
            width:100%;
            padding:13px 14px 13px 42px;
            font-size:14.5px;
            font-family:inherit;
            font-weight:500;
          
            background:rgba(0,0,0,0.18);
            border:1.5px solid  ;
            border-radius:14px;
             
        }

        #inp::placeholder{ color :rgb(195, 48, 195); }
 

       

        #list{
            list-style:none;
            margin:18px 0 0;
            padding:0;
            display:flex;
            flex-direction:column;
            gap:8px;
        }

        #list li{
            list-style:none;
            position:relative;
            padding:12px 14px 12px 52px;
            border-radius:14px;
            font-size:14.5px;
            font-weight:600;
            line-height:26px;
            background:rgb(139, 48, 139);
            border:1px solid transparent;
            text-transform:capitalize;
           
        }
 
    
    </style>
</head>
<body>

    <div class="panel">
        <h1>Find someone</h1>
               <div class="search-wrap">
            <input type="search" id="inp" placeholder="Search names...">
        
        </div>
        <ul id="list">
            <li  >ahmed</li>
            <li >ali</li>
            <li  >omar</li>
        </ul>
    </div>

<script>

let inp=document.getElementById('inp')
let list=document.querySelectorAll('#list li')

inp.addEventListener('input',function(){

    let value=inp.value

    list.forEach(item => {

     let hamada= item.textContent
        if(hamada.includes(value)){
           item.style.display='list-item'
        }else{
                item.style.display='none'
        }

    })

 })
</script>

</body>
</html>
