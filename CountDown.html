<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f1a;
    background-image: radial-gradient(circle at 20% 20%, #1b1b33 0%, #0f0f1a 60%);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    color: #fff;
  }

  
  

  #day {
    display: flex;
    gap: 18px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .unit {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 22px 24px;
    min-width: 100px;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  .unit .num {
    font-size: 42px;
    font-weight: 700;
    background: none;
    color:  blue ;
 
  }

  .unit .label {
    margin-top: 8px;
    font-size: 13px;
    color: #9d9dc9;
    letter-spacing: 1px;
  }

 
</style>

</head>
<body>
 
  <div id="day">
    <div class="unit"><div class="num" id="d">0</div><div class="label">Days</div></div>
    <div class="unit"><div class="num" id="h">0</div><div class="label">Hours</div></div>
    <div class="unit"><div class="num" id="m">0</div><div class="label">Minutes</div></div>
    <div class="unit"><div class="num" id="s">0</div><div class="label">Seconds</div></div>
  </div>

<script>
let cel = new Date("Aug 23 2026 00:00:00").getTime();

let x = setInterval(function () {
  let now = new Date().getTime();
  let y = cel - now;

  if (y <= 0) {
    clearInterval(x);
    document.getElementById("d").textContent = "0";
    document.getElementById("h").textContent = "0";
    document.getElementById("m").textContent = "0";
    document.getElementById("s").textContent = "0";
    return;
  }

  let days = Math.floor(y / (1000 * 60 * 60 * 24));
  let hours = Math.floor((y % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  let minutes = Math.floor((y % (1000 * 60 * 60)) / (1000 * 60));
  let seconds = Math.floor((y % (1000 * 60)) / 1000);

  document.getElementById("d").textContent = days;
  document.getElementById("h").textContent = hours;
  document.getElementById("m").textContent = minutes;
  document.getElementById("s").textContent = seconds;
}, 1000);
</script>

</body>
</html>
