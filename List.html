<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            background: linear-gradient(135deg, #1e1b2e 0%, #2d1f3d 50%, #1a2436 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 24px;
        }

        .btn-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .lab-btn {
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 26px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            color: #fff;
            background: linear-gradient(135deg, #7f5af0, #5e3fd1);
            box-shadow: 0 6px 16px rgba(94, 63, 209, 0.4);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .lab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(94, 63, 209, 0.55);
        }

      

        .lab-btn.alt {
            background: linear-gradient(135deg, #2cb67d, #1a8f5e);
            box-shadow: 0 6px 16px rgba(26, 143, 94, 0.4);
        }

        .lab-btn.alt:hover {
            box-shadow: 0 10px 22px rgba(26, 143, 94, 0.55);
        }

        #list {
            list-style: none;
            margin: 0;
            padding: 20px;
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            backdrop-filter: blur(6px);
        }

        #list li {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.9);
            color: #2d2140;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease;
        }

        #list li:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

     <div class="btn-row">
            <button class="lab-btn" id="first">Move First → Last</button>
            <button class="lab-btn alt" id="last">Move Last → First</button>
        </div>

        <ul id="list">
            <li>Html</li>
            <li>Css</li>
            <li>Js</li>
            <li>React</li>
        </ul>

    <script>
        
let first = document.getElementById('first')
let last = document.getElementById('last')
let list = document.getElementById('list')

first.onclick = function(){
    let li = list.firstElementChild
    list.append(li)
}

last.onclick = function(){
    let li = list.lastElementChild
    list.prepend(li)
}


    </script>
</body>
</html>
